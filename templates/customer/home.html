<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Cafe - Menu</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: url("{{ url_for('static', filename='cafe_ml.png') }}") no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
        }
        .overlay {
            background-color: rgba(255, 255, 255, 0.85); /* transparent overlay */
            min-height: 100vh;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex-direction: column;
        }
        .menu-container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #28a745;
        }
        .menu-item {
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .menu-item form {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        input[type="number"] {
            width: 60px;
            padding: 5px;
        }
        button {
            padding: 5px 10px;
            background-color: #007bff;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        @media (max-width: 768px) {
            .menu-container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="overlay">
        <div class="menu-container">
            <h1>Welcome to Smart Cafe</h1>
            {% for item in menu %}
            <div class="menu-item">
                <h4>{{ item.name }} - ${{ item.price }}</h4>
                <form method="POST" action="{{ url_for('place_order') }}">
                    <input type="hidden" name="item_id" value="{{ item.item_id }}">
                    <input type="number" name="quantity" min="1" value="1">
                    <button type="submit">Add to Order</button>
                </form>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
