<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        /* Body with Background Image */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            /* Background Image */
            background-image: url('{{ url_for("static", filename="cafe_ml.png") }}');
            background-size: cover;       /* Cover the whole page */
            background-position: center;  /* Center the image */
            background-repeat: no-repeat; /* Don't repeat */
        }

        /* Semi-transparent overlay to make form readable */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4); /* Dark overlay */
            z-index: 1;
        }

        /* Container Style */
        .login-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* Login Form Box */
        .login-box {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 30px 25px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.25);
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        /* Input Fields */
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #bbb;
            border-radius: 5px;
            font-size: 16px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #3586ff;
        }

        /* Button Style */
        .btn-login {
            width: 100%;
            padding: 10px;
            border: none;
            background: #3586ff;
            color: white;
            border-radius: 5px;
            font-size: 17px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-login:hover {
            background: #1f65d8;
        }

        /* Error Message */
        .msg {
            text-align: center;
            color: red;
            font-weight: 600;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="overlay"></div>

<div class="login-wrapper">
    <form action="/login" method="POST" class="login-box">
        <h2>Login</h2>

        {% if message %}
            <p class="msg">{{ message }}</p>
        {% endif %}

        <div class="input-group">
            <label>User Code</label>
            <input type="text" name="user_code" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>

        <button type="submit" class="btn-login">Login</button>
    </form>
</div>

</body>
</html>
