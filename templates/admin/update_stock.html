<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ action | title if action else 'Update Stock' }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="card shadow p-4">
      <h2 class="mb-4 text-center">{{ action | title if action else 'Update Stock' }}</h2>

      {% if message %}
      <div class="alert alert-info text-center" role="alert">{{ message }}</div>
      {% endif %}

      <table class="table table-bordered table-hover align-middle">
        <thead class="table-dark">
          <tr>
            <th>Ingredient ID</th>
            <th>Ingredient Name</th>
            <th>Current Quantity</th>
            <th>New Quantity</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          {% for ing in ingredients %}
          <tr>
            <td>{{ ing.ing_id }}</td>
            <td>{{ ing.ing_name }}</td>
            <td>{{ ing.quantity }}</td>
            <td>
              <form method="POST" class="d-flex">
                <input type="hidden" name="ing_id" value="{{ ing.ing_id }}">
                <input type="number" step="0.01" name="new_quantity" class="form-control me-2" placeholder="Enter new qty" required>
                <button type="submit" class="btn btn-success"><i class="bi bi-arrow-repeat"></i> Update</button>
              </form>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>

</body>
</html>
