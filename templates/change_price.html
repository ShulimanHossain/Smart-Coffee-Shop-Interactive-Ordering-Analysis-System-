<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ action | title if action else 'Change Price' }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="card shadow p-4">
      <h2 class="mb-4 text-center">
        {{ action | title if action else 'Change Price' }}
      </h2>

      {% if message %}
      <div class="alert alert-info text-center" role="alert">
        {{ message }}
      </div>
      {% endif %}

      <table class="table table-bordered table-hover align-middle">
        <thead class="table-dark">
          <tr>
            <th scope="col">Item ID</th>
            <th scope="col">Item Name</th>
            <th scope="col">Current Price</th>
            <th scope="col">New Price</th>
            <th scope="col">Action</th>
          </tr>
        </thead>
        <tbody>
          {% for item in menu %}
          <tr>
            <td>{{ item.item_id }}</td>
            <td>{{ item.name }}</td>
            <td>${{ item.price }}</td>
            <td>
              <form class="d-flex" method="POST" 
                    action="{{ url_for('change_price', admin_id=admin_id, item_id=item.item_id) }}">
                <input type="number" step="0.01" name="newprice" 
                       class="form-control me-2" placeholder="Enter new price" required>
                <button type="submit" class="btn btn-success">
                  <i class="bi bi-check-circle"></i> Update
                </button>
              </form>
            </td>
            <td>
              <i class="bi bi-tag"></i>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>

</body>
</html>
