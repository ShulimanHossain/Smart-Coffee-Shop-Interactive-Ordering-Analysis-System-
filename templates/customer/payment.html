<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment | Smart Cafe</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2d2d44);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #494983;
            border-radius: 15px;
            padding: 30px 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 400px;
            text-align: center;
        }
        h1 { color: #00c6ff; margin-bottom: 10px; }
        h3 { margin-bottom: 25px; color: #bbb; }

        .order-info {
            text-align: left;
            background: #3a3a4d;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        select, button, a.btn {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            margin-top: 10px;
            display: inline-block;
            text-decoration: none;
            text-align: center;
        }
        select { background: #44445e; color: #fff; }
        button, a.btn {
            background: #00c6ff;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover, a.btn:hover { background: #009bd1; }

        .msg {
            background: #222;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            color: #00ffcc;
        }
        .success { color: #00ff99; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Payment</h1>
        <h3>Order ID: {{ order.order_id }}</h3>

        <div class="order-info">
            <p><strong>Table:</strong> {{ order.table_no }}</p>
            <p><strong>Total Amount:</strong> {{ order.total_bill }} BDT</p>
            <p><strong>Status:</strong> {{ order.status }}</p>
        </div>

        {% if not payment_done %}
        <form method="POST">
            <label for="payment_method">Select Payment Method:</label>
            <select id="payment_method" name="payment_method" required>
                <option value="" disabled selected>Select Method</option>
                <option value="Cash">Cash</option>
                <option value="Card">Card</option>
                <option value="Mobile Banking">Mobile Banking (bKash/Nagad)</option>
            </select>
            <button type="submit">Confirm Payment</button>
        </form>

        {% else %}
        <div class="msg">
            <p class="success">✔ Payment Method: {{ payment_method }}</p>
            <p>{{ msg }}</p>
        </div>

        <!-- SHOW INVOICE BUTTON AFTER ADMIN CONFIRMS PAYMENT -->
        <a class="btn" href="{{ url_for('invoice', order_id=order.order_id) }}">
            View Invoice
        </a>
        {% endif %}
    </div>
</body>
</html>
