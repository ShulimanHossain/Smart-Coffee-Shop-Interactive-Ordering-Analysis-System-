<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe ML - Customer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .page-section {
            display: none;
        }
        .page-section.active {
            display: block;
        }
        
        /* Home/Menu Styles */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .main-content {
            display: flex;
            min-height: 600px;
        }
        .menu-section {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            max-height: calc(100vh - 200px);
        }
        .cart-section {
            width: 350px;
            background: #f8f9fa;
            border-left: 2px solid #e0e0e0;
            padding: 25px;
            position: sticky;
            top: 0;
            height: calc(100vh - 200px);
            display: flex;
            flex-direction: column;
        }
        .table-selection {
            margin-bottom: 25px;
            padding: 15px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .table-selection select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            margin-top: 10px;
        }
        .cart-header {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        .cart-list {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            min-height: 100px;
            max-height: calc(100vh - 450px);
        }
        .cart-empty {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-style: italic;
        }
        .cart-footer {
            border-top: 2px solid #e0e0e0;
            padding-top: 20px;
            margin-top: auto;
            flex-shrink: 0;
        }
        .total-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
        }
        .quantity-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
        }
        .price {
            color: #667eea;
            font-size: 1.5em;
            font-weight: bold;
            margin: 10px 0;
        }
        .previous-item {
            padding: 8px;
            border-bottom: 1px solid #ffc107;
            font-size: 0.9em;
        }
        .previous-items {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .menu-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .menu-item {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .menu-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            border-color: #667eea;
        }
        .btn-add {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
        .cart-item {
            background: white;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-place {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        
        /* Order Summary, Payment, Receipt Styles */
        .summary-container, .payment-container, .receipt-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .payment-method-card {
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid #e0e0e0;
        }
        .payment-method-card:hover {
            border-color: #667eea;
            transform: translateY(-5px);
        }
        .payment-method-card.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }
        .payment-waiting {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
        }
        .spinner-border {
            display: inline-block;
            width: 3rem;
            height: 3rem;
            border: 0.3em solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spinner-border 0.75s linear infinite;
        }
        @keyframes spinner-border {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- HOME/MENU SECTION -->
    <div id="home-section" class="page-section active">
        <div class="container" id="main-container">
            <div class="header">
                <h1>☕ Welcome to Cafe ML</h1>
                <p>Order your favorite items</p>
            </div>
            
            <div class="main-content">
                <div class="menu-section">
                    <h2>Menu</h2>
                    <div id="previous-items-container"></div>
                    <div class="menu-container" id="menu-container"></div>
                </div>
                
                <div class="cart-section">
                    <div class="table-selection">
                        <label for="table_no"><strong>Select Table Number:</strong></label>
                        <select id="table_no"></select>
                    </div>
                    <div class="cart-header">🛒 Your Cart</div>
                    <div class="cart-list" id="cart-list">
                        <div class="cart-empty">Cart is empty</div>
                    </div>
                    <div class="cart-footer">
                        <div class="total-section">
                            <span>Total:</span>
                            <span>$<span id="total-bill">0.00</span></span>
                        </div>
                        <button class="btn-place" id="place-order-btn" onclick="placeOrder()" disabled>Place Order</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ORDER SUMMARY SECTION -->
    <div id="summary-section" class="page-section">
        <div class="container mt-5">
            <div class="summary-container">
                <div class="card shadow">
                    <div class="card-header bg-success text-white text-center">
                        <h3 class="mb-0">Order Placed Successfully!</h3>
                    </div>
                    <div class="card-body" id="summary-body"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- PAYMENT SECTION -->
    <div id="payment-section" class="page-section">
        <div class="container mt-5">
            <div class="payment-container">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h3 class="mb-0">💳 Payment</h3>
                    </div>
                    <div class="card-body" id="payment-body"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- RECEIPT SECTION -->
    <div id="receipt-section" class="page-section">
        <div class="container mt-5">
            <div class="receipt-container">
                <div class="card shadow">
                    <div class="card-header" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; text-align: center;">
                        <h1>☕ Cafe ML</h1>
                        <p class="mb-0">Order Receipt</p>
                    </div>
                    <div class="card-body" id="receipt-body"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global state
        let cart = [];
        let currentOrderId = null;
        let lockedTableNo = null;
        let menuData = [];
        let tablesData = [];

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadInitialData();
            checkUrlState();
        });

        // Check URL for state (order_id, view type)
        function checkUrlState() {
            const urlParams = new URLSearchParams(window.location.search);
            const orderId = urlParams.get('order_id');
            const view = urlParams.get('view'); // summary, payment, receipt
            
            if (view === 'receipt' && orderId) {
                showReceipt(orderId);
            } else if (view === 'payment' && orderId) {
                showPayment(orderId);
            } else if (view === 'summary' && orderId) {
                showSummary(orderId);
            } else if (orderId) {
                loadOrderData(orderId);
            }
        }

        // Load initial data (menu, tables)
        async function loadInitialData() {
            try {
                const response = await fetch('/api/menu');
                menuData = await response.json();
                renderMenu();
                
                const tablesResponse = await fetch('/api/tables');
                tablesData = await tablesResponse.json();
                renderTables();
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        // Load order data if order_id in URL
        async function loadOrderData(orderId) {
            try {
                const response = await fetch(`/api/order/${orderId}`);
                const data = await response.json();
                
                if (data.order && data.order.status === 'active') {
                    currentOrderId = orderId;
                    lockedTableNo = data.order.table_no;
                    renderPreviousItems(data.items);
                    document.getElementById('table_no').value = lockedTableNo;
                    document.getElementById('table_no').disabled = true;
                }
            } catch (error) {
                console.error('Error loading order:', error);
            }
        }

        // Render menu items
        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = menuData.map(item => `
                <div class="menu-item">
                    <h3>${item.name}</h3>
                    <div class="price">$${parseFloat(item.price).toFixed(2)}</div>
                    <div class="quantity-control">
                        <label>Quantity:</label>
                        <input type="number" id="qty_${item.item_id}" value="1" min="1" style="width: 70px;">
                    </div>
                    <button class="btn-add" data-item-id="${item.item_id}" 
                            data-item-name="${item.name}" 
                            data-item-price="${item.price}"
                            onclick="addToCartFromButton(this)">
                        Add to Cart
                    </button>
                </div>
            `).join('');
        }

        // Render tables
        function renderTables() {
            const select = document.getElementById('table_no');
            select.innerHTML = '<option value="" disabled selected>-- Choose Table --</option>' +
                tablesData.map(t => `
                    <option value="${t.table_no}" ${t.status === 'Booked' && !lockedTableNo ? 'disabled' : ''}>
                        Table ${t.table_no} ${t.status === 'Booked' ? '(Booked)' : '(Available)'}
                    </option>
                `).join('');
            
            if (lockedTableNo) {
                select.value = lockedTableNo;
                select.disabled = true;
            }
        }

        // Render previous items
        function renderPreviousItems(items) {
            const container = document.getElementById('previous-items-container');
            if (items && items.length > 0) {
                container.innerHTML = `
                    <div class="previous-items">
                        <h3>📋 Previous Order Items (Order #${currentOrderId})</h3>
                        ${items.map(item => `
                            <div class="previous-item">
                                <strong>${item.name}</strong> - Qty: ${item.quantity} - $${(item.price * item.quantity).toFixed(2)}
                            </div>
                        `).join('')}
                    </div>
                `;
            }
        }

        // Cart functions
        function addToCartFromButton(button) {
            const itemId = parseInt(button.getAttribute('data-item-id'));
            const name = button.getAttribute('data-item-name');
            const price = parseFloat(button.getAttribute('data-item-price'));
            const qty = parseInt(document.getElementById('qty_' + itemId).value);
            addToCart(itemId, name, price, qty);
        }

        function addToCart(itemId, name, price, quantity) {
            const existing = cart.find(item => item.item_id === itemId);
            if (existing) {
                existing.quantity += quantity;
            } else {
                cart.push({ item_id: itemId, name: name, price: price, quantity: quantity });
            }
            document.getElementById('qty_' + itemId).value = 1;
            renderCart();
        }

        function renderCart() {
            const list = document.getElementById('cart-list');
            const totalEl = document.getElementById('total-bill');
            const placeBtn = document.getElementById('place-order-btn');
            
            list.innerHTML = "";
            let total = 0;

            if (cart.length === 0) {
                list.innerHTML = '<div class="cart-empty">Cart is empty</div>';
                placeBtn.disabled = true;
            } else {
                cart.forEach((item, index) => {
                    total += item.price * item.quantity;
                    const cartItem = document.createElement('div');
                    cartItem.className = 'cart-item';
                    cartItem.innerHTML = `
                        <div>
                            <div><strong>${item.name}</strong></div>
                            <div>Qty: ${item.quantity} × $${item.price.toFixed(2)}</div>
                        </div>
                        <button class="btn btn-sm btn-danger" onclick="removeFromCart(${index})">Remove</button>
                    `;
                    list.appendChild(cartItem);
                });
                if (lockedTableNo || document.getElementById('table_no').value) {
                    placeBtn.disabled = false;
                }
            }
            totalEl.innerText = total.toFixed(2);
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();
        }

        // Place order
        async function placeOrder() {
            let tableNo = lockedTableNo || document.getElementById('table_no').value;
            if (!tableNo || cart.length === 0) {
                alert("Please select a table and add items to cart.");
                return;
            }

            try {
                let url, body;
                if (currentOrderId) {
                    url = `/order/${currentOrderId}/add_items`;
                    body = JSON.stringify({ cart: cart });
                } else {
                    url = '/order/create';
                    body = JSON.stringify({ table_no: tableNo, cart: cart });
                }

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: body
                });

                const text = await response.text();
                const data = JSON.parse(text);
                
                if (data.order_id) {
                    showSummary(data.order_id);
                } else {
                    alert("Error: " + (data.error || text));
                }
            } catch (err) {
                alert("Network error occurred.");
            }
        }

        // Show different sections
        function showSection(sectionId) {
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
        }

        async function showSummary(orderId) {
            currentOrderId = orderId;
            const response = await fetch(`/api/order/${orderId}`);
            const data = await response.json();
            
            document.getElementById('summary-body').innerHTML = `
                <div class="row mb-4">
                    <div class="col-6"><h5>Order ID: #${data.order.order_id}</h5></div>
                    <div class="col-6 text-end"><h5>Table: ${data.order.table_no}</h5></div>
                </div>
                <h5 class="border-bottom pb-2">Items Ordered</h5>
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Item Name</th>
                            <th class="text-center">Quantity</th>
                            <th class="text-end">Price</th>
                            <th class="text-end">Subtotal</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${data.items.map(item => `
                            <tr>
                                <td>${item.name}</td>
                                <td class="text-center">${item.quantity}</td>
                                <td class="text-end">$${parseFloat(item.price).toFixed(2)}</td>
                                <td class="text-end">$${(item.price * item.quantity).toFixed(2)}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                    <tfoot>
                        <tr class="table-active">
                            <th colspan="3" class="text-end">Total Bill:</th>
                            <th class="text-end">$${parseFloat(data.order.total_bill).toFixed(2)}</th>
                        </tr>
                    </tfoot>
                </table>
                <div class="d-grid gap-2 mt-4">
                    <button class="btn btn-success btn-lg" onclick="window.location.href='/?order_id=${orderId}'">➕ Add More Items</button>
                    <button class="btn btn-primary btn-lg" onclick="showPayment(${orderId})">💳 Complete Payment</button>
                </div>
            `;
            showSection('summary-section');
            window.history.pushState({}, '', `/?view=summary&order_id=${orderId}`);
        }

        async function showPayment(orderId) {
            const response = await fetch(`/api/order/${orderId}`);
            const data = await response.json();
            
            if (data.order.payment_status === 'pending' && data.order.payment_method) {
                // Show waiting screen
                document.getElementById('payment-body').innerHTML = `
                    <div class="payment-waiting">
                        <h4>⏳ Waiting for Payment Confirmation</h4>
                        <p><strong>Payment Method:</strong> ${data.order.payment_method}</p>
                        <p>A waiter will receive your payment. Please wait for confirmation.</p>
                        <div class="spinner-border text-warning"></div>
                        <p class="mt-3"><small>This page will automatically redirect when payment is confirmed.</small></p>
                    </div>
                `;
                // Auto-check payment
                const checkInterval = setInterval(async () => {
                    const checkResponse = await fetch(`/order/${orderId}/check_payment`);
                    const checkData = await checkResponse.json();
                    if (checkData.payment_status === 'paid') {
                        clearInterval(checkInterval);
                        showReceipt(orderId);
                    }
                }, 3000);
            } else {
                // Show payment selection
                document.getElementById('payment-body').innerHTML = `
                    <div class="row mb-4">
                        <div class="col-6"><h5>Order ID: #${data.order.order_id}</h5></div>
                        <div class="col-6 text-end"><h5>Total: $${parseFloat(data.order.total_bill).toFixed(2)}</h5></div>
                    </div>
                    <h5 class="text-center mb-4">Select Payment Method</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <div class="card payment-method-card" id="cash-card" onclick="selectPaymentMethod('cash')">
                                <div class="card-body text-center p-4">
                                    <h2>💵</h2>
                                    <h5>Cash</h5>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="card payment-method-card" id="card-card" onclick="selectPaymentMethod('card')">
                                <div class="card-body text-center p-4">
                                    <h2>💳</h2>
                                    <h5>Card</h5>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="d-grid gap-2">
                        <button class="btn btn-primary btn-lg" id="confirm-payment-btn" onclick="requestPayment(${orderId})" disabled>Confirm Payment</button>
                        <button class="btn btn-secondary" onclick="showSummary(${orderId})">Back to Order Summary</button>
                    </div>
                `;
            }
            showSection('payment-section');
            window.history.pushState({}, '', `/?view=payment&order_id=${orderId}`);
        }

        let selectedPaymentMethod = null;
        function selectPaymentMethod(method) {
            selectedPaymentMethod = method;
            document.getElementById('cash-card').classList.remove('selected');
            document.getElementById('card-card').classList.remove('selected');
            document.getElementById(method + '-card').classList.add('selected');
            document.getElementById('confirm-payment-btn').disabled = false;
        }

        async function requestPayment(orderId) {
            if (!selectedPaymentMethod) return;
            if (!confirm(`Confirm payment with ${selectedPaymentMethod.toUpperCase()}?`)) return;
            
            const response = await fetch(`/order/${orderId}/request_payment`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ payment_method: selectedPaymentMethod })
            });
            
            const data = await response.json();
            if (data.success) {
                showPayment(orderId); // Reload to show waiting
            } else {
                alert('Error: ' + (data.error || 'Failed to request payment'));
            }
        }

        async function showReceipt(orderId) {
            const response = await fetch(`/api/order/${orderId}`);
            const data = await response.json();
            
            if (data.order.payment_status !== 'paid') {
                showSummary(orderId);
                return;
            }
            
            document.getElementById('receipt-body').innerHTML = `
                <div class="alert alert-success text-center">
                    <h4>✅ Payment Confirmed!</h4>
                    <p class="mb-0">Thank you for your payment. Your order has been completed.</p>
                </div>
                <div class="row mb-3">
                    <div class="col-6"><strong>Order Number:</strong><br><span class="h5">#${data.order.order_id}</span></div>
                    <div class="col-6 text-end"><strong>Table:</strong><br><span class="h5">${data.order.table_no}</span></div>
                </div>
                <hr>
                <div class="row mb-3">
                    <div class="col-6"><strong>Order Date:</strong><br>${data.order.order_date}</div>
                    <div class="col-6 text-end"><strong>Order Time:</strong><br>${data.order.order_time}</div>
                </div>
                <div class="row mb-3">
                    <div class="col-6"><strong>Payment Method:</strong><br>${data.order.payment_method}</div>
                    <div class="col-6 text-end"><strong>Status:</strong><br><span class="badge bg-success">Completed</span></div>
                </div>
                <hr>
                <h5 class="mb-3">Items Ordered:</h5>
                <table class="table table-sm">
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th class="text-center">Qty</th>
                            <th class="text-end">Price</th>
                            <th class="text-end">Subtotal</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${data.items.map(item => `
                            <tr>
                                <td>${item.name}</td>
                                <td class="text-center">${item.quantity}</td>
                                <td class="text-end">$${parseFloat(item.price).toFixed(2)}</td>
                                <td class="text-end">$${(item.price * item.quantity).toFixed(2)}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                    <tfoot>
                        <tr class="table-active">
                            <th colspan="3" class="text-end">Total:</th>
                            <th class="text-end">$${parseFloat(data.order.total_bill).toFixed(2)}</th>
                        </tr>
                    </tfoot>
                </table>
                <div class="text-center mt-4">
                    <button class="btn btn-primary btn-lg" onclick="window.location.href='/'">Back to Home</button>
                </div>
            `;
            showSection('receipt-section');
            window.history.pushState({}, '', `/?view=receipt&order_id=${orderId}`);
        }

        // Table change handler
        document.addEventListener('DOMContentLoaded', function() {
            const tableSelect = document.getElementById('table_no');
            if (tableSelect) {
                tableSelect.addEventListener('change', function() {
                    if (!lockedTableNo) {
                        const placeBtn = document.getElementById('place-order-btn');
                        placeBtn.disabled = !this.value || cart.length === 0;
                    }
                });
            }
        });
    </script>
</body>
</html>
