<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Delete Menu Items</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
  <h2 class="mb-4 text-center">Delete Menu Items</h2>

  <table class="table table-bordered table-striped">
    <thead>
      <tr>
        <th>ID</th>
        <th>Item Name</th>
        <th>Price</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      {% for item in menu_items %}
      <tr>
        <td>{{ item.item_id }}</td>
        <td>{{ item.name }}</td>
        <td>${{ item.price }}</td>
        <td>
          <form method="POST" action="{{ url_for('delete_menu', admin_id=admin_id) }}">
            <input type="hidden" name="item_id" value="{{ item.item_id }}">
            <button type="submit" class="btn btn-danger btn-sm">
              🗑️ Delete
            </button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <a href="{{ url_for('admin_dashboard', admin_id=admin_id) }}" class="btn btn-secondary mt-3">Back</a>
</div>
</body>
</html>
