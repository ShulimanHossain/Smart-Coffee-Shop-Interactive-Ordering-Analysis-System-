<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Cafe - Customer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: url("{{ url_for('static', filename='cafe_ml.png') }}") no-repeat center center fixed;
            background-size: cover;
        }
        .overlay {
            background-color: rgba(255,255,255,0.6);
            min-height: 100vh;
            padding: 20px;
        }
        .menu-item {
            cursor: pointer;
            transition: 0.2s;
        }
        .menu-item:hover {
            transform: scale(1.05);
        }
        .cart {
            background: rgba(255,243,224,0.8);
            padding: 15px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<!-- ===================== MAIN ORDER UI ===================== -->
<div class="overlay container" id="main-ui">
    <h1 class="text-center mb-4">Welcome to Smart Cafe</h1>

    <div class="row">
        <!-- MENU -->
        <div class="col-md-8">
            <div class="row g-3">
                {% for item in menu %}
                <div class="col-md-4">
                    <div class="card menu-item p-3 text-center"
                         data-id="{{ item.item_id }}"
                         data-name="{{ item.name }}"
                         data-price="{{ item.price }}">
                        <h5>{{ item.name }}</h5>
                        <p>$ {{ item.price }}</p>
                        <span class="badge bg-success">Click to Add</span>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>

        <!-- CART -->
        <div class="col-md-4">
            <div class="cart">
                <h4>Cart</h4>

                <label>Select Table</label>
                <select id="table-select" class="form-select mb-3">
                    {% for table in tables %}
                        <option value="{{ table.table_no }}"
                            {% if table.status != 'Free' %}disabled{% endif %}>
                            Table {{ table.table_no }} - {{ table.status }}
                        </option>
                    {% endfor %}
                </select>

                <div id="cart-items">
                    <p class="text-muted">No items added yet</p>
                </div>

                <hr>
                <strong>Total: $<span id="cart-total">0.00</span></strong>

                <button class="btn btn-warning w-100 mt-3"
                        type="button"
                        onclick="placeOrder()">
                    Place Order
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ===================== ORDER SUCCESS UI ===================== -->
<div class="container mt-5" id="order-success" style="display:none;">
    <div class="card p-4 text-center">
        <h2 class="text-success">✅ Order Placed Successfully</h2>
        <p>Order ID: <strong id="success-order-id"></strong></p>

        <div id="success-items" class="text-start mt-3"></div>

        <h4>Total: $<span id="success-total"></span></h4>

        <button class="btn btn-primary mt-3" onclick="location.reload()">
            Place New Order
        </button>
    </div>
</div>

<!-- ===================== JAVASCRIPT ===================== -->
<script>
let cart = [];

/* ADD ITEMS */
document.querySelectorAll(".menu-item").forEach(item => {
    item.addEventListener("click", () => {
        const id = item.dataset.id;
        const name = item.dataset.name;
        const price = parseFloat(item.dataset.price);

        const existing = cart.find(i => i.item_id == id);
        if (existing) {
            existing.quantity++;
        } else {
            cart.push({ item_id: id, name, price, quantity: 1 });
        }
        updateCart();
    });
});

/* UPDATE CART UI */
function updateCart() {
    const cartDiv = document.getElementById("cart-items");
    const totalSpan = document.getElementById("cart-total");

    cartDiv.innerHTML = "";
    let total = 0;

    if (cart.length === 0) {
        cartDiv.innerHTML = `<p class="text-muted">No items added yet</p>`;
        totalSpan.textContent = "0.00";
        return;
    }

    cart.forEach((item, index) => {
        total += item.price * item.quantity;
        cartDiv.innerHTML += `
            <div class="d-flex justify-content-between mb-2">
                <span>${item.name} × ${item.quantity}</span>
                <button class="btn btn-sm btn-danger" onclick="removeItem(${index})">X</button>
            </div>
        `;
    });

    totalSpan.textContent = total.toFixed(2);
}

function removeItem(index) {
    cart.splice(index, 1);
    updateCart();
}

/* PLACE ORDER — ONLY JS FETCH */
function placeOrder() {
    if (cart.length === 0) {
        alert("Cart is empty");
        return;
    }

    const tableNo = document.getElementById("table-select").value;

    fetch("/place_order", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            table_no: tableNo,
            cart: cart
        })
    })
    .then(res => res.json())
    .then(data => {
        if (data.error) {
            alert(data.error);
            return;
        }
        showOrderSuccess(data.order_id);
    })
    .catch(() => alert("Order failed"));
}

/* SHOW SUCCESS SCREEN */
function showOrderSuccess(orderId) {
    document.getElementById("main-ui").style.display = "none";
    document.getElementById("order-success").style.display = "block";

    document.getElementById("success-order-id").textContent = orderId;

    let total = 0;
    const itemsDiv = document.getElementById("success-items");
    itemsDiv.innerHTML = "";

    cart.forEach(item => {
        total += item.price * item.quantity;
        itemsDiv.innerHTML += `<p>${item.name} × ${item.quantity}</p>`;
    });

    document.getElementById("success-total").textContent = total.toFixed(2);
    cart = [];
}
</script>

</body>
</html>
